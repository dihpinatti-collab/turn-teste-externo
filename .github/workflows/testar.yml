# Testa o TURN de turn.yagoriccomi.com.br a partir de fora da rede de casa.
# As credenciais vêm por input, geradas na VM com validade curta
# (scripts/credencial.sh teste 900), e são mascaradas no log.
name: testar-turn
on:
  workflow_dispatch:
    inputs:
      usuario:         { description: "username valido", required: true }
      senha:           { description: "credential valida", required: true }
      usuario_vencido: { description: "username vencido", required: true }
      senha_vencida:   { description: "credential vencida", required: true }
jobs:
  testar:
    runs-on: ubuntu-24.04
    steps:
      - name: Mascarar credenciais
        run: |
          echo "::add-mask::${{ inputs.senha }}"
          echo "::add-mask::${{ inputs.senha_vencida }}"
      # O mesmo cliente da bateria de dentro de casa (scripts/testar.sh): o
      # uclient 4.6 do apt do Ubuntu 24.04 recebia 400 no channel bind.
      - name: Baixar o cliente de teste do coturn
        run: docker pull -q coturn/coturn:4.18.0-r0
      - name: Testes
        env:
          U: ${{ inputs.usuario }}
          P: ${{ inputs.senha }}
          UV: ${{ inputs.usuario_vencido }}
          PV: ${{ inputs.senha_vencida }}
        run: |
          H=turn.yagoriccomi.com.br
          falhas=0
          echo "IP publico deste robo: $(curl -s https://api.ipify.org)"
          echo "DNS: $(getent ahostsv4 $H | head -1)"
          caso() { local desc="$1" esperado="$2"; shift 2
            # O Actions roda com -e -o pipefail; o uclient sai != 0 mesmo quando
            # repassa, e o grep sai 1 quando não acha: nenhum dos dois é falha aqui.
            timeout 25 docker run --rm --network host --entrypoint turnutils_uclient coturn/coturn:4.18.0-r0 \
              -n 5 -m 1 -l 100 "$@" $H > out.txt 2>&1 || true
            { grep -E "Received relay addr|tot_recv_bytes ~|Total lost|error 4|Cannot complete" out.txt || true; } | sort -u | sed 's/^/      /' | head -4
            if grep -q "tot_recv_bytes ~ [1-9]" out.txt; then r=repassou; else r=recusado; fi
            if [ "$r" = "$esperado" ]; then echo "  ok     $desc ($r)"; else echo "  FALHOU $desc ($r, esperado $esperado)"; falhas=$((falhas+1)); fi; }
          caso "UDP 3478"           repassou -y -u "$U" -w "$P"
          caso "UDP 3478 sem canal" repassou -y -c -u "$U" -w "$P"
          caso "TCP 3478"           repassou -y -t -u "$U" -w "$P"
          caso "TLS 5349"           repassou -y -t -S -p 5349 -u "$U" -w "$P"
          caso "credencial vencida" recusado -y -u "$UV" -w "$PV"
          echo "Certificado visto de fora:"
          echo | openssl s_client -connect $H:5349 -servername $H -verify_return_error 2>/dev/null | grep -E "subject=|issuer=|Verify return code" | sed 's/^/      /'
          if echo | openssl s_client -connect $H:5349 -servername $H -verify_return_error >/dev/null 2>&1; then echo "  ok     certificado"; else echo "  FALHOU certificado"; falhas=$((falhas+1)); fi
          if [ $falhas -eq 0 ]; then echo "tudo ok"; else echo "$falhas falha(s)"; exit 1; fi
